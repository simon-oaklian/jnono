<!doctype html>
<html lang="zh-CN">
<head>
  <meta name="robots" content="noindex,nofollow">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JNONO | Admin Translation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;800&family=Barlow:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css?v=20260327a" />
</head>
<body class="admin-shell">
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-sidebar-brand">JNONO Admin</div>
      <nav class="admin-sidebar-nav">
        <a href="/admin.html">Admin Home</a>
        <a href="/admin-structure.html">Structure</a>
        <a href="/admin-questions.html">Questions</a>
        <a class="active" href="/admin-translation.html">Translation</a>
        <a href="/admin-members.html">Members</a>
        <a href="/admin-progress.html">Progress</a>
        <a href="/admin-dashboard.html">Dashboard</a>
        <a href="/admin-settings.html">Settings</a>
        <a href="/">Front site</a>
      </nav>
      <div class="auth-actions admin-sidebar-auth">
        <span id="adminWelcome" class="welcome hidden"></span>
        <button class="btn ghost hidden" id="adminLogoutBtn">退出管理</button>
      </div>
    </aside>

    <main class="admin-content">
      <section id="adminLoginPanel" class="panel" style="max-width:560px;margin:30px auto 0;">
        <div class="panel-head">
          <h2>管理系统登录</h2>
          <p>登录后进入翻译校对模块</p>
        </div>
        <form id="adminLoginForm" class="login-form" style="margin-top:14px;">
          <label>
            管理员账号
            <input id="adminEmailInput" type="email" required placeholder="请输入管理员账号" />
          </label>
          <label>
            管理员密码
            <input id="adminPasswordInput" type="password" required placeholder="请输入密码" />
          </label>
          <button class="btn primary" type="submit">登录管理系统</button>
        </form>
        <p id="adminLoginError" class="login-error hidden" style="color:#be2f2f"></p>
      </section>

      <section id="adminPanel" class="panel hidden">
      <details id="translationReviewSection" class="panel admin-collapsible admin-collapsible-panel" style="margin-top:12px;padding:14px;">
        <summary>翻译校对（V1）</summary>
        <div class="admin-collapsible-body">
          <div class="panel-head">
            <p>导入英文题后可在此校对中文翻译，保存后前台立即生效</p>
          </div>
          <div class="filters">
            <label>
              考试分类
              <select id="reviewExamSelect"></select>
            </label>
            <label>
              题目
              <select id="reviewQuestionSelect"></select>
            </label>
          </div>
          <div class="panel" style="margin-top:12px;padding:12px;">
            <p style="margin:0 0 10px;color:#5f6d82;">
              翻译状态：<strong id="reviewTranslationStatus">--</strong>
            </p>
            <div class="filters" style="gap:10px;margin-bottom:10px;">
              <label style="max-width:220px;">
                题目状态
                <select id="reviewQuestionStatus">
                  <option value="active">active</option>
                  <option value="inactive">inactive</option>
                  <option value="deleted">deleted</option>
                </select>
              </label>
              <label style="min-width:280px;">
                归属考试（exam_code）
                <select id="reviewTargetExamSelect"></select>
              </label>
            </div>
            <label>
              英文题干（只读）
              <textarea id="reviewPromptEn" rows="2" readonly></textarea>
            </label>
            <label>
              中文题干（可编辑）
              <textarea id="reviewPromptZh" rows="2"></textarea>
            </label>
            <label>
              英文选项（只读）
              <textarea id="reviewOptionsEn" rows="4" readonly></textarea>
            </label>
            <label>
              中文选项（可编辑，每行一个）
              <textarea id="reviewOptionsZh" rows="4"></textarea>
            </label>
            <label>
              英文解析（只读）
              <textarea id="reviewExplanationEn" rows="3" readonly></textarea>
            </label>
            <label>
              Memory Trick（可编辑）
              <textarea id="reviewMemoryTrick" rows="2" placeholder="可选：输入记忆技巧或答题技巧"></textarea>
              <p style="margin-top:6px;font-size:12px;color:#7b8798;">
                用于填写中文记忆技巧 / 快速记忆口诀 / 易错提醒，可留空。
              </p>
            </label>
            <label>
              中文解析（可编辑）
              <textarea id="reviewExplanationZh" rows="3"></textarea>
            </label>
            <label>
              英文考点分析（只读）
              <textarea id="reviewKeyPointEn" rows="2" readonly></textarea>
            </label>
            <label>
              中文考点分析（可编辑）
              <textarea id="reviewKeyPointZh" rows="2"></textarea>
            </label>
            <label>
              英文答题理由（只读）
              <textarea id="reviewReasoningEn" rows="3" readonly></textarea>
            </label>
            <label>
              中文答题理由（可编辑）
              <textarea id="reviewReasoningZh" rows="3"></textarea>
            </label>
            <label>
              中文题型（可编辑）
              <input id="reviewQuestionTypeZh" type="text" placeholder="例如：安全管理" />
            </label>
            <div class="catalog-actions">
              <button class="btn primary" id="saveReviewBtn">保存中文翻译</button>
            </div>
            <p id="reviewSaveMsg" class="register-success hidden" style="margin-top:8px;"></p>
          </div>
        </div>
      </details>
      </section>
    </main>
  </div>

  <script src="/admin.js?v=20260424b" type="module"></script>
</body>
</html>
