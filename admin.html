<!doctype html>
<html lang="zh-CN">
<head>
  <meta name="robots" content="noindex,nofollow">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JNONO | 管理首页</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;800&family=Barlow:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css?v=20260818c" />
</head>
<body class="admin-shell">
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-sidebar-brand">JNONO Admin</div>
      <nav class="admin-sidebar-nav">
        <a class="active" href="/admin.html">管理首页</a>
        <span class="admin-nav-label">用户</span>
        <a href="/admin-members.html">用户管理</a>
        <span class="admin-nav-label">内容</span>
        <a href="/admin-structure.html">考试结构</a>
        <a href="/admin-questions.html">题库管理</a>
        <span class="admin-nav-label">系统</span>
        <a href="/admin-dashboard.html">前台配置</a>
        <a href="/admin-settings.html">系统设置</a>
        <hr class="admin-nav-divider" />
        <a href="/">前台首页</a>
      </nav>
      <div class="auth-actions admin-sidebar-auth">
        <span id="adminWelcome" class="welcome hidden"></span>
        <button class="btn ghost hidden" id="adminLogoutBtn">退出管理</button>
      </div>
    </aside>

    <main class="admin-content">
      <section id="adminLoginPanel" class="panel" style="max-width:560px;margin:30px auto 0;">
        <div class="panel-head">
          <h2>管理系统登录</h2>
          <p>登录后进入管理首页</p>
        </div>
        <form id="adminLoginForm" class="login-form" style="margin-top:14px;">
          <label>
            管理员账号
            <input id="adminEmailInput" type="email" required placeholder="请输入管理员账号" />
          </label>
          <label>
            管理员密码
            <input id="adminPasswordInput" type="password" required placeholder="请输入密码" />
          </label>
          <button class="btn primary" type="submit">登录管理系统</button>
        </form>
        <p id="adminLoginError" class="login-error hidden" style="color:#be2f2f"></p>
      </section>

      <section id="adminPanel" class="panel hidden">
        <div class="panel-head">
          <h2>管理首页</h2>
          <p>选择要操作的模块</p>
        </div>
        <div class="benefit-grid" style="margin-top:16px;">
          <article>
            <h3>👥 用户管理</h3>
            <p>会员计划、账号状态、内容权限、考试绑定与学习进度。</p>
            <a class="btn primary" href="/admin-members.html" style="display:inline-flex;margin-top:10px;text-decoration:none;">进入</a>
          </article>
          <article>
            <h3>🏗 考试结构</h3>
            <p>维护结构树（项目/子项）与考试项目配置。</p>
            <a class="btn primary" href="/admin-structure.html" style="display:inline-flex;margin-top:10px;text-decoration:none;">进入</a>
          </article>
          <article>
            <h3>📚 题库管理</h3>
            <p>权限分类、考试分类、题库导入、翻译校对与题目筛选。</p>
            <a class="btn primary" href="/admin-questions.html" style="display:inline-flex;margin-top:10px;text-decoration:none;">进入</a>
          </article>
          <article>
            <h3>🖥 前台配置</h3>
            <p>控制首页模块显示、排序、可见范围与课程占位入口。</p>
            <a class="btn primary" href="/admin-dashboard.html" style="display:inline-flex;margin-top:10px;text-decoration:none;">进入</a>
          </article>
          <article>
            <h3>⚙️ 系统设置</h3>
            <p>微信联系、会员价格与限时优惠配置。</p>
            <a class="btn primary" href="/admin-settings.html" style="display:inline-flex;margin-top:10px;text-decoration:none;">进入</a>
          </article>
        </div>
      </section>
    </main>
  </div>

  <script src="/admin.js?v=20260818c" type="module"></script>
<!-- Cloudflare Web Analytics --><script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "4b2bcc256ac741e8b45dcc4ad8f69bef"}'></script><!-- End Cloudflare Web Analytics -->
</body>
</html>
